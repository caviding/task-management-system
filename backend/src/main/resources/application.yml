spring:
  application:
    name: TaskManagementSystem

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  web:
    error:
      include-message: always

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8080